name: CI

on:
  push:
    branches: ["ci", "main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      VCPKG_DISABLE_METRICS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The configure step builds the dependencies with the bundled vcpkg into
      # build/vcpkg_installed. They depend on the vcpkg revision and on
      # vcpkg.json, so those two make the cache key.
      - name: Identify vcpkg revision
        id: vcpkg
        run: echo "revision=$(git rev-parse HEAD:vcpkg)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: >
          ctest --test-dir build
          --build-config Release
          --output-on-failure
          --no-tests=error
          --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results.xml
          if-no-files-found: ignore
