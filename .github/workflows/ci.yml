name: CI

on:
  push:
    branches: ["ci", "main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: arm64-osx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-

      - name: Bootstrap vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        shell: pwsh

      # vcpkg would fetch pkg-config from msys2 packages pinned by the submodule
      # revision, and the mirrors no longer serve them; hand it a current one.
      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-pkgconf

      - name: Point vcpkg at pkg-config (Windows)
        if: runner.os == 'Windows'
        run: |
          $pkgconfig = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin\pkg-config.exe'
          if (-not (Test-Path $pkgconfig)) { throw "pkg-config not found at $pkgconfig" }
          "PKG_CONFIG=$($pkgconfig -replace '\\', '/')" >> $env:GITHUB_ENV
          "VCPKG_KEEP_ENV_VARS=PKG_CONFIG" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Install dependencies via vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./vcpkg/vcpkg install --triplet ${{ matrix.triplet }}

      - name: Install dependencies via vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\vcpkg.exe install --triplet ${{ matrix.triplet }}
        shell: pwsh

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: >
          ctest --test-dir build
          --build-config Release
          --output-on-failure
          --no-tests=error
          --output-junit test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/test-results.xml
          if-no-files-found: ignore
